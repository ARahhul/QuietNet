[project]
name = "pahra"
version = "0.1.0"
description = "QuietNet AI engine: AdGuard Home poller, domain classifier, per-device rule pusher and REST API"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tldextract>=5.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "mcp>=1.2",
    "sse-starlette>=2.1",
    "langfuse (>=3)",
    "tzdata (>=2024.1)",
]

[tool.poetry]
packages = [{ include = "pahra" }, { include = "devtools" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
respx = ">=0.21"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
