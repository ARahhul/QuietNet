name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install "poetry>=2,<3"
      - uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ hashFiles('backend/poetry.lock') }}
      - run: poetry install
      - run: poetry run pytest -q

  companion:
    name: Companion tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install "poetry>=2,<3"
      - uses: actions/cache@v4
        with:
          path: companion/.venv
          key: companion-venv-${{ hashFiles('companion/poetry.lock') }}
      - run: poetry install
      - run: poetry run pytest -q

  frontend:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
